<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Pressure Grid</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", sans-serif;
      background: transparent;
      color: #eaf0ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: transparent;
    }

    .stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas id="grid" aria-label="压力值网格"></canvas>
    <span id="title" class="sr-only">等待传感器初始化</span>
    <span id="channel" class="sr-only">未绑定 channelId</span>
    <span id="state" class="sr-only" role="status">sandbox ready</span>
    <span id="summary" class="sr-only">0 values</span>
  </main>

  <script src="./app.js"></script>
</body>
</html>
